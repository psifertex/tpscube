<!DOCTYPE html>
<html manifest="manifest.appcache">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

<!-- Disable zooming: -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<head>
    <title>TPS Cube</title>

    <link rel="icon" type="image/png" href="/favicon_16x16.png" sizes="16x16">
    <link rel="icon" type="image/png" href="/favicon_32x32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="/favicon_128x128.png" sizes="128x128">
    <link rel="apple-touch-icon" href="/favicon_180x180.png">

    <meta name="apple-mobile-web-app-title" content="TPS Cube">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="#383838">

    <style>
        html {
            /* Remove touch delay: */
            touch-action: manipulation;
        }

        body {
            /* Background color for what is not covered by the egui canvas,
            or where the egui canvas is translucent. */
            background: #404040;
        }

        /* Allow canvas to fill entire web page: */
        html,
        body {
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* Fill the viewport with the canvas: */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <!-- The WASM code will resize this canvas to cover the entire screen -->
    <canvas id="the_canvas_id"></canvas>

    <!-- This is the JS generated by the `wasm-bindgen` CLI tool -->
    <script src="tpscube.js"></script>

    <script>
        // Load and instantiate the WASM module.
        // The #[wasm_bindgen(start)] function runs automatically during instantiation.
        wasm_bindgen("./tpscube_bg.wasm")
            .then(function() { console.log("WASM loaded successfully"); })
            ["catch"](function(e) { console.error("WASM load error:", e); document.body.innerText = "Error: " + e; });
    </script>
</body>

</html>
