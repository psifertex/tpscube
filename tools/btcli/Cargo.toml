[package]
name = "btcli"
version = "0.1.0"
edition = "2018"

[dependencies]
tpscube_core = { path = "../../lib", features = ["bluetooth"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ctrlc = "3"
btleplug = "0.11"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
uuid = "1"
